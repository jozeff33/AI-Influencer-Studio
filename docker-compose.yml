services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio_dev_only
      POSTGRES_DB: studio
    volumes:
      - studio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      MEDIA_DIR: /app/media
    volumes:
      - studio_media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  # Opt-in background scheduler. Starts ONLY with --profile autopilot.
  story_worker:
    profiles: ["autopilot"]
    build: ./backend
    command: ["python", "-m", "app.story_worker"]
    env_file: .env
    environment:
      MEDIA_DIR: /app/media
    volumes:
      - studio_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args: []
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  studio_db:
  studio_media:
